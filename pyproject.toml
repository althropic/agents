[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-assistant-agent"
version = "0.1.0"
description = "A local AI file assistant agent"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
]

[project.scripts]
agent = "src.runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
