llm:
  base_url: "http://localhost:8080/v1"
  api_key: "local-env"
  model: "nemotron-3-ultra"
  temperature: 0.2
  max_tokens: 32000
  # thinking_budget: controls how many tokens the model may spend on its
  # internal reasoning trace.  Passed as `reasoning_effort` (or equivalent)
  # to models that support it.  Set to 0 to disable.  Ignored by models
  # that do not support reasoning.
  thinking_budget: 8192

agent:
  system_prompt: "You are a File Assistant Agent. Use your tools to read, write, search, and manage files, run shell commands, inspect git status, and run tests. Always use a tool when you need real data — never guess file contents."
  max_iterations: 20
  max_file_size_kb: 100

memory:
  persist: false
  export_path: ".agent_memory"

file_access:
  allowed_roots:
    - "."

logging:
  level: "INFO"
  log_dir: "logs"
  max_size_kb: 100

execution:
  # Commands the agent is allowed to run via run_command, git_*, and run_tests.
  # Any command not in this list is blocked with a PermissionError.
  allowed_commands:
    - "pytest"
    - "python"
    - "pip"
    - "git"
  # Maximum seconds a shell command may run before it is killed.
  timeout_seconds: 30
