llm:
  base_url: "http://localhost:8080/v1"
  api_key: "local-env"
  model: "nemotron-3-ultra"
  temperature: 0.2
  max_tokens: 32000
  # thinking_effort: reasoning depth for Ollama/OpenAI-compatible servers.
  # Sent as the `reasoning_effort` extra_body key — a string enum, not a token
  # count.  none|low|medium|high|max.  "none" disables thinking.  Ignored by
  # models that do not expose reasoning.
  thinking_effort: "high"
  # thinking_budget: integer token budget, used ONLY when thinking_param is
  # set to an Anthropic-style key (e.g. "thinking"). 0 disables it. Has no
  # effect on the reasoning_effort path above.
  thinking_budget: 0
  # thinking_param: the extra_body key used to pass thinking config to the
  # model server.  "reasoning_effort" (default) pairs with thinking_effort for
  # Ollama/OpenAI.  Change to "thinking" for Anthropic-style endpoints, which
  # pairs with thinking_budget instead.
  thinking_param: "reasoning_effort"
  # show_reasoning: when true, the REPL prints the model's chain-of-thought
  # inline (dimmed) as it streams. Off by default — traces are verbose.
  # Toggle at runtime with /reason on|off.
  show_reasoning: false

agent:
  system_prompt: "You are a File Assistant Agent. Use your tools to read, write, search, and manage files, run shell commands, inspect git status, and run tests. Always use a tool when you need real data — never guess file contents."
  max_iterations: 20
  max_file_size_kb: 100

memory:
  persist: false
  export_path: ".agent_memory"

file_access:
  allowed_roots:
    - "."

logging:
  level: "INFO"
  log_dir: "logs"
  max_size_kb: 100

execution:
  # Commands the agent is allowed to run via run_command, git_*, and run_tests.
  # Any command not in this list is blocked with a PermissionError.
  allowed_commands:
    - "pytest"
    - "python"
    - "pip"
    - "git"
  # Maximum seconds a shell command may run before it is killed.
  timeout_seconds: 30

web_fetch:
  # Set enabled: true to allow the agent to fetch public URLs.
  # Disabled by default — opt in when you need live documentation or API specs.
  enabled: false
  # Maximum response size in KB. Responses larger than this are rejected.
  max_response_kb: 100
  # Request timeout in seconds.
  timeout_seconds: 15
